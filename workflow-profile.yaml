# Workflow profile for equity-data-agent, generated by flow-init (2026-08-15).
# This repo is the source project the flow suite was extracted FROM, so most values below
# are drawn directly from its own CLAUDE.md, Makefile, and .github/workflows — verified against
# the live repo state at generation time, not guessed from the package template.

project:
  name: "Equity Data Agent"
  default_branch: main

tracker:
  kind: linear
  identifier_regex: "QNT-\\d+"
  identifier_example: "QNT-442"
  adapter: "adapters/linear.sh"       # fallback only — this session has a native Linear MCP tool
  get_issue:       "{adapter} issue get {id}"
  set_in_progress: "{adapter} issue status {id} 'In Progress'"
  set_in_review:   "{adapter} issue status {id} 'In Review'"
  set_done:        "{adapter} issue status {id} 'Done'"
  add_comment:     "{adapter} issue comment {id}"
  next_issue:      ""
  branch_from_issue: "branchName"     # Linear supplies e.g. noahwinsdev/qnt-442-...
  branch_template:   "user/{id_lower}-{slug}"

vcs:
  commit_format: "{id}: {type}({scope}): {description}"
  wip_commit:    "{id}: {type}({scope}): wip - {description}"
  commit_hook_note: >-
    .githooks/commit-msg enforces two patterns on the first line: issue-linked
    "^QNT-[0-9]+: (feat|fix|refactor|test|docs|chore)\(.+\): .+" (code changes, WIP commits
    included — type+scope required, a bare "QNT-XX: wip: ..." is rejected), or meta
    "^(docs|chore): .+" for process-only commits with no issue.
  pr_title:  "{id}: {title}"
  pr_body_closes: "Closes {id}"
  pr_footer: ""                       # no Co-Authored-By / Generated-with footer, ever

verify:
  lint:   "uv run ruff check ."
  format: "uv run ruff format --check ."
  types:  "uv run pyright"
  test:   "make test"
  test_note: "Do NOT use bare 'uv run pytest' — it collects the live-judge suite. make test scopes to unit + deterministic evals."
  build: ""                           # no compiled/bundled step; `make build` (Docker images) is a
                                      # conditional pre-push gate only when Dockerfile/compose/pyproject
                                      # changed, not a per-ship verify step — CLAUDE.md Git Workflow.
  test_targeted: "uv run pytest {path} -x -q"
  security: ""                        # no local CVE-audit command in this repo; CVE coverage is
                                      # Dependabot (weekly version updates) + Trivy image scan
                                      # (security-weekly.yml, advisory-only, not a merge gate).

deploy:
  ci_status:    "gh pr checks {pr} --watch"
  merge:        "gh pr merge {pr} --squash --delete-branch"
  # Deploy is fully automated: .github/workflows/deploy.yml fires on push to main (CD SHA gate,
  # obs-smoke, auto-rollback already built in). Ship phase watches that run, then independently
  # re-verifies identity post-merge rather than trusting "workflow green" alone.
  deployed_sha: "ssh hetzner 'cd /opt/equity-data-agent && git rev-parse HEAD'"
  runtime_id:   "ssh hetzner 'curl -sf http://localhost:8000/health'"   # JSON body includes git_sha
  health:       "make check-prod"
  rollback:     "make rollback"

docs:
  plan:          "docs/project-plan.md"
  spec:          "docs/project-requirement.md"
  patterns:      "docs/patterns.md"
  architecture:  "docs/architecture/system-overview.md"
  decisions_dir: "docs/decisions"
  adr_template:  "docs/decisions/TEMPLATE.md"
  adr_index:     "docs/INDEX.md"
  retros_dir:    "docs/retros"
  ac_templates:  "docs/AC-templates.md"

architecture_rules: |
  - The LLM never does arithmetic; all math lives in the calculation layer (Dagster/SQL).
  - The agent never touches the database directly; it goes through FastAPI.
  - Three roles, no overlap: Dagster = Worker, FastAPI = Interpreter, LangGraph = Executive.
  - No hardcoded ticker lists — use packages/shared/src/shared/tickers.py.

ac_execution_keywords:
  - populated
  - backfill
  - "no duplicates"
  - returns
  - responds
  - deployed
  - "in prod"
  - visible
  - healthy
  - receipt
  - pasted

review:
  fresh_eyes_agent: "flow:flow-code-reviewer"

cadence:
  team:    "Quant"
  project: "Equity Data Agent"
  active_cycle:   "{adapter} cycle active '{team}'"
  status_update:  "{adapter} project status-update '{project}'"

taxonomy:
  team_id: "6da338db-71b2-4d14-9519-8a19231e1ccd"
  labels:
    - ai
    - backend
    - frontend
    - infra
  ops_milestone: "Ops & Reliability"
  perpetual_milestones:
    - "Ops & Reliability"
  health_on_track_min: 0.50
  health_at_risk_min:  0.25

audit:
  host:            "hetzner"
  compose_file:    "/opt/equity-data-agent/docker-compose.yml"
  repo_path:       "/opt/equity-data-agent"
  health_url:      "http://localhost:8000/api/v1/health"
  expected_min_health_partition_free_pct: 20
